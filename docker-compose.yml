services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proos
      POSTGRES_USER: proos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U proos"], interval: 10s, timeout: 5s, retries: 10 }

  migrate:
    build: .
    command: sh -c "npx prisma db push --schema prisma/schema.postgres.prisma --skip-generate && if [ \"$SEED_DEMO\" = \"1\" ]; then npx tsx prisma/seed.ts; fi"
    env_file: .env.production
    environment: { DATABASE_URL: "postgresql://proos:${POSTGRES_PASSWORD:-change-me}@db:5432/proos?schema=public" }
    depends_on: { db: { condition: service_healthy } }

  web:
    build: .
    ports: ["3100:3100"]
    env_file: .env.production
    environment: { DATABASE_URL: "postgresql://proos:${POSTGRES_PASSWORD:-change-me}@db:5432/proos?schema=public" }
    volumes: ["uploads:/app/data/uploads"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  worker:
    build: .
    command: npx tsx scripts/worker.ts
    env_file: .env.production
    environment: { DATABASE_URL: "postgresql://proos:${POSTGRES_PASSWORD:-change-me}@db:5432/proos?schema=public" }
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
